<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEnv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <linearGradient id="goldEnv" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFF2A3"/>
      <stop offset="100%" stop-color="#AA771C"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" rx="16" fill="url(#bgEnv)"/>
  <rect x="24" y="24" width="752" height="512" rx="10" fill="none" stroke="#065f46" stroke-width="3"/>
  <rect x="32" y="32" width="736" height="496" rx="8" fill="none" stroke="url(#goldEnv)" stroke-width="1.8"/>

  <!-- Corner Ornaments -->
  <path d="M 38 70 L 70 38 M 38 80 L 80 38" stroke="url(#goldEnv)" stroke-width="1.5"/>
  <path d="M 762 70 L 730 38 M 762 80 L 720 38" stroke="url(#goldEnv)" stroke-width="1.5"/>
  <path d="M 38 490 L 70 522 M 38 480 L 80 522" stroke="url(#goldEnv)" stroke-width="1.5"/>
  <path d="M 762 490 L 730 522 M 762 480 L 720 522" stroke="url(#goldEnv)" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <circle cx="0" cy="-25" r="24" fill="#059669"/>
    <!-- Leaf Icon -->
    <path d="M -6 -18 C -14 -32 6 -34 10 -34 C 10 -34 12 -14 -2 -14 Z" fill="#ffffff"/>
    <text y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#059669" letter-spacing="4">DEUTSCHE ACCREDITATION BOARD</text>
    <text y="44" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="28" font-weight="800" fill="#0B1F3A" letter-spacing="1">REGISTRATION CERTIFICATE</text>
    <line x1="-140" y1="56" x2="140" y2="56" stroke="url(#goldEnv)" stroke-width="2"/>
  </g>

  <!-- Content -->
  <g transform="translate(400, 205)" text-anchor="middle">
    <text y="0" font-family="'Inter', sans-serif" font-size="13" fill="#64748b" letter-spacing="1.5" text-transform="uppercase">This is to certify that the Environmental Management System of</text>
    <text y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="800" fill="#0B1F3A">MEDIWAVES INC.</text>
    <text y="54" font-family="'Inter', sans-serif" font-size="12" fill="#475467">Works: Plot No. 92, HSIIDC, Sector-57, Phase-IV, Kundli, Sonipat, Haryana, India</text>
    <text y="88" font-family="'Inter', sans-serif" font-size="13" fill="#64748b">has been assessed and found to conform to the requirements of:</text>
    
    <rect x="-180" y="104" width="360" height="42" rx="21" fill="rgba(5,150,105,0.08)" stroke="#059669" stroke-width="1.5"/>
    <text y="131" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#059669" letter-spacing="1">ISO 14001:2015</text>
    
    <text y="174" font-family="'Inter', sans-serif" font-size="12.5" font-weight="600" fill="#0B1F3A">Environmental Management for Manufacturing of Medical &amp; Hospital Equipment</text>
    <text y="194" font-family="'Inter', sans-serif" font-size="11.5" fill="#475467">Infant Care Equipment, Phototherapy, O.T. Equipments &amp; Patient Monitors</text>
  </g>

  <!-- Gold Seal -->
  <g transform="translate(140, 445)">
    <circle cx="0" cy="0" r="44" fill="url(#goldEnv)"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="4 2"/>
    <text y="-4" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#0B1F3A">ISO 14001</text>
    <text y="10" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0B1F3A">ENVIRONMENT</text>
    <path d="M -16 38 L -24 64 L -8 56 L 0 64 L -4 38 Z" fill="#AA771C"/>
    <path d="M 16 38 L 24 64 L 8 56 L 0 64 L 4 38 Z" fill="#D4AF37"/>
  </g>

  <!-- Signatures -->
  <g transform="translate(400, 455)">
    <text x="-90" y="0" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b">Certificate No: <tspan font-weight="700" fill="#0B1F3A">MIEM2603161</tspan></text>
    <text x="-90" y="16" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b">Accreditation: <tspan font-weight="700" fill="#0B1F3A">Deutsche Accreditation Board</tspan></text>
    <text x="-90" y="32" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10.5" fill="#64748b">Valid Through: <tspan font-weight="700" fill="#059669">31/03/2029</tspan></text>

    <g transform="translate(190, 10)">
      <path d="M -60 0 Q -25 -14 -5 2 T 35 -10 T 60 4" fill="none" stroke="#0B1F3A" stroke-width="1.8"/>
      <line x1="-70" y1="12" x2="70" y2="12" stroke="#94a3b8" stroke-width="1"/>
      <text y="25" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#0B1F3A">Certification Manager</text>
      <text y="37" text-anchor="middle" font-family="'Inter', sans-serif" font-size="9" fill="#64748b">Deutsche Accreditation Board, Germany</text>
    </g>
  </g>
</svg>

