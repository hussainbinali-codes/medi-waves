p.sub{margin:16px 0 32px;font-size:15.5px;line-height:1.7}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{padding:13px 26px;border-radius:999px;font-weight:700;font-size:14.5px;transition:transform .2s,box-shadow .2s}
.btn-primary{background:var(--grad-brand);color:#fff;box-shadow:0 10px 24px rgba(12,84,160,.3)}
.btn-outline{border:1.5px solid var(--gray-200);color:var(--navy)}
.btn:hover{transform:translateY(-2px)}
